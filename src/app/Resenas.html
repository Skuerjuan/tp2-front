<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header">
        <h1 id="titulo">Reseñas</h1>
        <p id="subtitulo">Agregá un libro nuevo y dejá tu impresión.</p>
    </div>
 
    <nav id="nav">
      <a href="main.html">Home</a>
      <a href="LibrosLeidos.html" class="active">Libros leídos</a>
      <a href="Resenas.html">Reseñas</a>
      <a href="Buscar.html">Buscar</a>
    </nav>
 
    <main>
        <div class="formulario-box" id="formulario">
            <h2>Agregar un libro</h2>
            <input type="text" id="tituloInput" placeholder="Título">
            <input type="text" id="autorInput"  placeholder="Autor">
            <select id="generoInput">
                <option value="">Seleccionar género…</option>
                <option value="novela">Novela</option>
                <option value="cuento">Cuento</option>
                <option value="ensayo">Ensayo</option>
                <option value="poesia">Poesía</option>
                <option value="ciencia ficcion">Ciencia ficción</option>
                <option value="fantasia">Fantasía</option>
                <option value="terror">Terror</option>
                <option value="historica">Histórica</option>
                <option value="biografía">Biografía</option>
                <option value="otro">Otro</option>
            </select>
            <div class="full-col" style="display:flex; flex-direction:column; gap:.4rem;">
                <label style="font-size:.85rem; color:var(--brown); font-style:italic;">Puntaje</label>
                <div class="puntaje" id="puntajeInput" style="justify-content:flex-start; gap:6px;">
                    <span class="estrella" data-valor="1">☆</span>
                    <span class="estrella" data-valor="2">☆</span>
                    <span class="estrella" data-valor="3">☆</span>
                    <span class="estrella" data-valor="4">☆</span>
                    <span class="estrella" data-valor="5">☆</span>
                </div>
                <input type="hidden" id="puntajeValor" value="0">
            </div>
            <textarea id="resenaInput" placeholder="Escribe tu reseña…"></textarea>
            <button type="submit" onclick="agregarLibro()">Agregar libro</button>
        </div>
        <h2 class="section-title">✦ Últimas reseñas agregadas</h2>
        <div id="contenido" class="grid-libros"></div>
    </main>
 
    <script src="tarjetas.js"></script>
    <script src="AgregarLibro.js"></script> 
</body>
</html>
