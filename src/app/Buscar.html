<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buscar — Página de Reseñas</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <style>
            .buscador-hero {
                text-align: center;
                padding: 2.5rem 1rem 2rem;
                margin-bottom: 2rem;
            }

            .buscador-hero h2 {
                font-family: 'Playfair Display', serif;
                font-size: clamp(1.4rem, 3vw, 2rem);
                color: var(--brown);
                margin-bottom: 1.2rem;
            }

            .buscador-wrap {
                display: flex;
                gap: .6rem;
                max-width: 560px;
                margin: 0 auto 1rem;
            }

            .buscador-wrap input {
                flex: 1;
                padding: .8rem 1.2rem;
                border: 2px solid rgba(92,61,30,.25);
                border-radius: 8px;
                background: var(--card-bg);
                font-family: 'Lora', serif;
                font-size: 1rem;
                color: var(--ink);
                outline: none;
                transition: border-color .25s, box-shadow .25s;
            }

            .buscador-wrap input:focus {
                border-color: var(--gold);
                box-shadow: 0 0 0 3px rgba(200,146,42,.15);
            }

            .buscador-wrap button {
                padding: .8rem 1.6rem;
                background: var(--brown);
                color: var(--cream);
                border: none;
                border-radius: 8px;
                font-family: 'Playfair Display', serif;
                font-size: .95rem;
                cursor: pointer;
                transition: background .2s, transform .15s;
            }

            .buscador-wrap button:hover { background: var(--rust); }
            .buscador-wrap button:active { transform: scale(.97); }

            .filtro-genero-buscar {
                display: flex;
                justify-content: center;
                gap: .6rem;
                flex-wrap: wrap;
                margin-bottom: .5rem;
            }

            .filtro-genero-buscar select {
                padding: .5rem 1rem;
                border: 1px solid rgba(92,61,30,.25);
                border-radius: 6px;
                background: var(--card-bg);
                font-family: 'Lora', serif;
                font-size: .88rem;
                color: var(--ink);
                outline: none;
                appearance: none;
                transition: border-color .25s;
            }

            .filtro-genero-buscar select:focus {
                border-color: var(--gold);
            }

            #contadorResultados {
                text-align: center;
                font-style: italic;
                color: var(--brown);
                opacity: .7;
                font-size: .9rem;
                margin-bottom: 1.5rem;
                min-height: 1.4rem;
            }
        </style>
    </head>
    <body>

        <div id="header">
            <h1 id="titulo">Buscar</h1>
            <p id="subtitulo">Encontrá libros en tu biblioteca personal.</p>
        </div>

        <nav id="nav">
            <a href="main.html">Home</a>
            <a href="LibrosLeidos.html">Libros leídos</a>
            <a href="Resenas.html">Reseñas</a>
            <a href="Buscar.html" class="active">Buscar</a>
        </nav>

        <main>

            <div class="buscador-hero">
                <h2>¿Qué libro estás buscando?</h2>

                <div class="buscador-wrap">
                    <input
                        type="text"
                        id="buscarInput"
                        placeholder="Título, autor o palabra clave…"
                        autocomplete="off"
                    >
                    <button onclick="buscar()">Buscar</button>
                </div>

                <div class="filtro-genero-buscar">
                    <select id="buscarGenero">
                        <option value="">Todos los géneros</option>
                        <option value="novela">Novela</option>
                        <option value="cuento">Cuento</option>
                        <option value="ensayo">Ensayo</option>
                        <option value="poesia">Poesía</option>
                        <option value="ciencia ficcion">Ciencia ficción</option>
                        <option value="fantasia">Fantasía</option>
                        <option value="terror">Terror</option>
                        <option value="historica">Histórica</option>
                        <option value="biografía">Biografía</option>
                        <option value="otro">Otro</option>
                    </select>

                    <select id="buscarPuntaje">
                        <option value="">Cualquier puntaje</option>
                        <option value="5">★★★★★</option>
                        <option value="4">★★★★☆ o más</option>
                        <option value="3">★★★☆☆ o más</option>
                    </select>
                </div>
            </div>

            <p id="contadorResultados"></p>

            <div id="contenido" class="grid-libros"></div>

            <p class="sin-resultados" id="sinResultados" style="display:none;">
                No se encontraron resultados para tu búsqueda.
            </p>

        </main>

        <script src="tarjetas.js"></script>
    </body>
</html>
